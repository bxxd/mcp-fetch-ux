[tool.poetry]
name = "mcp-fetch-ux"
version = "0.1.0"
description = "Real-Chrome (Patchright) web-fetch MCP server with clipboard extraction"
authors = ["idio"]
license = "MIT"
readme = "DEVELOPER.md"
packages = [
    { include = "fetch_ux", from = "src" },
    { include = "mcp_fetch_ux", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
playwright = "^1.49"
mcp = "^1.0.0"
starlette = "^0.41.0"
uvicorn = "^0.32.0"
python-dotenv = "^1.0.0"
# Browser engines (hexagonal — selected via FETCH_UX_ENGINE):
patchright = "^1.58.2"   # chrome engine: real Chrome stealth
invisible-playwright = { git = "https://github.com/bxxd/forked-invisible_playwright.git", rev = "f208f5262cacec28efcba40e7af910f19cf6f4e1" }  # invisible engine (default): stealth Firefox (our fork of feder-cr/invisible_playwright, pinned)

[tool.poetry.group.dev.dependencies]
ruff = ">=0.7.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
